name: Refresh market scan

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scanner.py"
      - "watchlist.json"
      - "requirements.txt"
      - ".github/workflows/refresh-data.yml"
  schedule:
    - cron: "*/5 13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan market universe
        run: python scanner.py
      - name: Publish refreshed scan safely
        run: |
          cp data/scan.json /tmp/scan.json
          git config user.name "maple-zones-bot"
          git config user.email "actions@users.noreply.github.com"

          # Move onto the newest main branch first so app/code edits that
          # happened while the scan was running cannot conflict with scan data.
          git fetch origin main
          git reset --hard origin/main

          # Put only the newly generated market data back on top.
          cp /tmp/scan.json data/scan.json
          git add data/scan.json

          if git diff --cached --quiet; then
            echo "No scan-data changes to publish"
            exit 0
          fi

          git commit -m "Refresh market scan"
          git push origin HEAD:main
