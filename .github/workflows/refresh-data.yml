name: Refresh market scan

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13-21 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py
      - name: Commit refreshed scan
        run: |
          git config user.name "maple-zones-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh market scan"
          git push
